[project]
name = "ehr-triage"
version = "0.1.0"
description = "Synthetic EHR access logs for testing LLM triage of access anomalies"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["networkx>=3.0", "numpy>=1.26", "pandas>=2.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
