# Calibration config for the synthetic EHR access-log generator.
#
# Everything the generator reads is in this file, so values measured from
# real data can replace published ones without code changes.
#
# targets     the published measures from the literature review. The report
#             compares generated data against them. `use` says how.
#               level     compare the generated value to the number
#               shape     compare ratios only (the UK log is far sparser)
#               reported  measured and shown, nothing is set to hit it
#               later     cannot be measured until the baselines exist
# parameters  what the generator uses. `basis` says where a value comes from.
#               published   taken from a cited source
#               derived     computed from published values, see note
#               assumption  no public source, a judgement call
#               setting     run setup, not a calibration choice

targets:
  # ---- US audit logs, the unit this generator uses for an access ----
  accesses_per_staff_week:
    value: [375, 580]
    use: level
    source: "Fabbri & LeFevre 2013 (Michigan, about 375); Hedda et al. 2017 and Laszka et al. 2017 (Vanderbilt, about 580)"
  repeat_access_share:
    value: 0.92
    use: level
    source: "Hedda et al. 2017 (6.9M of 7.5M accesses in one week)"
    note: "A repeat is the same user opening the same patient earlier in the same week. The same table lists 710K unique non-self accesses, which would put the share nearer 90%"
  self_access_share:
    value: 0.003
    use: level
    source: "Hedda et al. 2017 (21K of 7.5M accesses in one week)"
  first_access_explained_direct:
    value: 0.23
    use: level
    source: "Fabbri & LeFevre 2013"
  first_access_explained_with_responsibility:
    value: 0.41
    use: reported
    source: "Fabbri & LeFevre 2013 (evidence plus departmental responsibility, s = 1, t = 2)"
    note: "Responsibility is mined from the generated log with their method and thresholds"
  all_accesses_explained:
    value: 0.94
    use: reported
    source: "Fabbri & LeFevre 2011, 2013 (over 94% once repeats are filtered)"
  rule_match_share:
    value: {organization co-worker: 0.0384, department co-worker: 0.0004, last name: 0.0014, proximity: 0.0016, same street: 0.0012}
    use: reported
    source: "Hedda et al. 2017, Table 3 (observed share of 100,000 unique non-self accesses)"
  rule_observed_to_expected:
    value: {organization co-worker: 1.0, department co-worker: 3.22, last name: 1.53, proximity: 2.51, same street: 4.04}
    use: reported
    source: "Hedda et al. 2017, Table 2 (patients permuted)"
    note: "How much more often a rule fires than it would if users and patients were paired at random"
  rule_match_explained_share:
    value: {organization co-worker: 0.3878, department co-worker: 0.4390, last name: 0.2143, proximity: 0.2479, same street: 0.1611}
    use: reported
    source: "Hedda et al. 2017, Table 4 (share of rule-matching accesses explained by five clinical reasons)"
    note: "Measured here as the share of rule-matching first accesses with direct evidence"
  alerts_per_access:
    value: 0.10
    use: later
    source: "Laszka et al. 2017"
  nurse_chart_time_share:
    value: 0.34
    use: level
    source: "Association Between EHR-Based Nursing Workload and Turnover, JMIR Nursing 2026 (432 inpatient nurses, median 260 minutes of EHR time per shift, about 34% of a shift)"
    note: "Chart time of inpatient nurses as a share of scheduled shift time. Read from the abstract and results summary only, the full text could not be fetched"
  physician_ehr_hours_per_day:
    value: 5.9
    use: reported
    source: "Arndt et al. 2017 (primary care, 355 minutes per weekday per clinical FTE, from EHR event logs)"
    note: "Measured here for primary care physicians per scheduled day"

  # ---- UK log (Herrera Montano et al.). It records about 9 events per user
  # per week, a much coarser unit, so only measures that do not depend on the
  # unit are compared, and only by shape ----
  events_per_user:
    value: {median: 220, p95: 2160}
    use: shape
    source: "Herrera Montano et al., Table 3 (over 18 months)"
  patients_per_user:
    value: {median: 149, p99: 3424}
    use: shape
    source: "Herrera Montano et al., Table 3 (over 18 months)"
  devices_per_user:
    value: {median: 22, p95: 93}
    use: shape
    source: "Herrera Montano et al., Table 3 (over 18 months)"
  patient_index_in_user_day:
    value: {median: 5, p99: 80}
    use: shape
    source: "Herrera Montano et al., Table 5 (patient_day_user_id)"
    note: "Per event, the position of its patient among the distinct patients that user opened that day"
  action_top21_share:
    value: 0.80
    use: shape
    source: "Herrera Montano et al. (21 of 13,723 routine codes cover about 80% of events)"
  zero_gap_same_patient_share:
    value: 0.554
    use: reported
    source: "Herrera Montano et al. (is_repeat_same_patient_immediate)"
    note: "Share of events with zero time since the same user last opened the same patient. A first access counts as zero by the paper's convention, and timestamps have minute resolution. About 54 of the 55 points are first accesses, so this mostly reflects the coarser unit"
  duration_median_s:
    value: 45
    use: reported
    source: "Herrera Montano et al., Table 5"
    note: "Per routine in the UK log, not per access in the US sense"
  duration_p95_s:
    value: 775
    use: reported
    source: "Herrera Montano et al., Table 5"

parameters:
  # ---- run setup ----
  seed:
    value: 42
    basis: setting
  window_start:
    value: "2026-09-28"
    basis: setting
    note: "A Monday. The window ends before the Synthea reference date"
  window_days:
    value: 30
    basis: setting
  synthea:
    value: {version: "v3.2.0", seed: 42, population: 3500, reference_date: "20261101", location: "Massachusetts Springfield"}
    basis: setting
    note: "Must match scripts/run_synthea.sh"

  # ---- taken from published sources ----
  duration_cap_s:
    value: 300
    basis: published
    source: "Five-minute inactivity threshold used to turn audit-log timestamps into active time (JMIR Nursing 2026 nursing workload study; reviewed in Rule et al. 2020)"
    note: "Longest time one access can hold the user. US audit logs carry no duration field, so duration here means time until the user's next action, capped at this threshold"
  duration_median_s:
    value: 36
    basis: derived
    source: "Sized against inpatient nurse chart time, about 34% of a shift (JMIR Nursing 2026)"
    note: "First set to 25 s on paper, from an estimate of about 206 accesses per nurse shift. The run had about 150, and nurse chart time came out at 25%. Raised to 36 s on 11 Nov 2026 after that comparison: with sigma 1.2 and the five-minute cap the mean is about 64 s, and 150 accesses at 64 s is a third of an 8-hour shift"
  duration_sigma:
    value: 1.2
    basis: assumption
    note: "Spread of the lognormal duration. No published figure at this log unit"
  visit_continue_prob:
    value: 0.7
    basis: derived
    source: "Sized against Hedda et al. 2017, 7.5M accesses over 710K unique user-patient pairs in a week, about 10.6 accesses per pair"
    note: "Chance that a visit to a chart continues with another access. 0.7 gives 3.3 accesses per visit. With about 3.2 visits per user-patient pair per week that is near 10.6"
  self_access_share:
    value: 0.003
    basis: published
    source: "Hedda et al. 2017"
  action_top_n:
    value: 21
    basis: published
    source: "Herrera Montano et al."
  action_top_share:
    value: 0.80
    basis: published
    source: "Herrera Montano et al."
    note: "Code popularity is a power law whose exponent is solved so the top 21 codes carry this share"
  proximity_miles:
    value: 0.25
    basis: published
    source: "Hedda et al. 2017 (geographic proximity rule)"
  action_categories:
    value: {read: 0.50, query: 0.10, create: 0.16, update: 0.17, print: 0.04, copy: 0.02, delete: 0.01}
    basis: published
    source: "Category list from the CASRAI guide to audit-log requirements, which summarises ASTM E2147-18"
    note: "The category names are published. The shares are an assumption"

  # ---- hospital shape ----
  departments:
    value:
      MED1: {name: "Medical unit 1", kind: inpatient, hours: round_the_clock}
      MED2: {name: "Medical unit 2", kind: inpatient, hours: round_the_clock}
      SURG: {name: "Surgical unit", kind: inpatient, hours: round_the_clock}
      ICU: {name: "Intensive care unit", kind: inpatient, hours: round_the_clock}
      ED: {name: "Emergency department", kind: emergency, hours: round_the_clock}
      PCP: {name: "Primary care clinic", kind: clinic, hours: office}
      CARD: {name: "Cardiology clinic", kind: clinic, hours: office}
      ORTH: {name: "Orthopedics clinic", kind: clinic, hours: office}
      LAB: {name: "Laboratory", kind: ancillary, hours: round_the_clock}
      RAD: {name: "Radiology", kind: ancillary, hours: round_the_clock}
      PHARM: {name: "Pharmacy", kind: ancillary, hours: round_the_clock}
      REG: {name: "Registration", kind: back_office, hours: round_the_clock}
      HIM: {name: "Health information management", kind: back_office, hours: office}
      BILL: {name: "Billing", kind: back_office, hours: office}
      CM: {name: "Care management", kind: hospital_wide, hours: round_the_clock}
    basis: assumption
    note: "A small community hospital. No public source for this layout"
  staffing:
    value:
      MED1: {physician: 6, nurse: 22, clerk: 2}
      MED2: {physician: 6, nurse: 22, clerk: 2}
      SURG: {physician: 3, nurse: 14, clerk: 1}
      ICU: {physician: 4, nurse: 20, clerk: 1}
      ED: {physician: 8, nurse: 26, clerk: 4}
      PCP: {physician: 10, nurse: 12, clerk: 4}
      CARD: {physician: 5, nurse: 6, clerk: 2}
      ORTH: {physician: 5, nurse: 6, clerk: 2}
      LAB: {technician: 22}
      RAD: {physician: 3, technician: 15}
      PHARM: {pharmacist: 14, technician: 4}
      REG: {clerk: 16}
      HIM: {coder: 16}
      BILL: {coder: 17}
      CM: {coordinator: 8}
    basis: assumption
    note: "Full-time equivalents, 308 in total. Headcount is higher because of the employment mix below"
  employment_mix:
    value:
      full_time: {share: 0.60, shifts_per_week: 5}
      part_time: {share: 0.25, shifts_per_week: 3}
      occasional: {share: 0.15, shifts_per_week: 1}
    basis: assumption
    note: "Share of headcount in each class. Herrera Montano et al. show most users are active on a minority of days, but give no employment data. At 0.78 FTE per head, 308 FTE is about 395 people"
  load_weight_sigma:
    value: 0.6
    basis: assumption
    note: "Spread of a per-person workload weight (lognormal). Work is handed out in proportion to it, so some people carry far more than others, as in the heavy tail of events per user in Herrera Montano et al."
  staff_age_range:
    value: [22, 67]
    basis: assumption
    note: "Staff are sampled from Synthea adults in this age range"
  shifts:
    value: {day: [7, 15], evening: [15, 23], night: [23, 31], office: [8, 17]}
    basis: assumption
    note: "Start and end hour. Night runs into the next day"
  shift_weights:
    value: {day: 0.5, evening: 0.3, night: 0.2}
    basis: assumption
    note: "Share of round-the-clock staff on each shift"
  physician_shift_pattern:
    value:
      default: [day, day, evening, day, night, day]
      ED: [day, evening, night, day, evening, night, day, evening]
    basis: assumption
    note: "Physicians in a round-the-clock department take shifts in this order, so every unit has day cover and the emergency department is staffed evenly"
  devices_per_staff:
    value: 1.0
    basis: assumption
    note: "Workstations per department per FTE. Physicians also get a mobile device. Herrera Montano et al. report 2,270 devices for 1,515 users"
  usual_device_count:
    value: {median: 4, sigma: 0.8}
    basis: assumption
    note: "How many of the department's workstations a person habitually uses (lognormal, at least 1). Use falls off as 1 over rank. Herrera Montano et al. report a median of 22 devices per user over 18 months and find device diversity the strongest marker of atypical users"
  away_device_prob:
    value: {order: 0.3, consult: 0.5, hospital_wide: 0.5, registration: 0.5}
    basis: assumption
    note: "Chance that this kind of work is done on a shared workstation in the patient's department instead of the person's own, for inpatient and emergency patients. Without it, a device outside the home department would give shared credentials away"
  remote_share:
    value: 0.3
    basis: assumption
    note: "Share of back-office staff who mostly work from a remote device"

  # ---- encounters in the window ----
  encounter_lookback_years:
    value: 10
    basis: assumption
    note: "Synthea encounters this recent form the pool that is re-dated into the window. Five years leaves too few inpatient stays"
  inpatient_census:
    value: {MED1: 36, MED2: 36, SURG: 14, ICU: 12}
    basis: assumption
    note: "Average occupied beds. Set from the staffing above at about 5 patients per day-shift nurse, 2 in the ICU"
  inpatient_los_clip_hours:
    value: [12, 240]
    basis: assumption
    note: "Synthea stay lengths are kept, clipped to this range"
  ed_visits_per_day:
    value: 60
    basis: assumption
    note: "Emergency and urgent-care arrivals per day"
  ed_night_relative_rate:
    value: 0.4
    basis: assumption
    note: "Arrival rate from 23:00 to 07:00 relative to daytime"
  ed_los_clip_hours:
    value: [1, 12]
    basis: assumption
    note: "Synthea visit lengths are kept, clipped to this range"
  clinic_visits_per_physician_day:
    value: {PCP: 12, CARD: 9, ORTH: 9}
    basis: published
    source: "Tai-Seale et al. 2017, 12.3 visits per physician per day, as cited in Adler-Milstein et al. 2020"
    note: "Appointments per physician FTE on a weekday. The primary care figure is published. The two specialty figures are assumptions"
  clinic_los_clip_minutes:
    value: [15, 60]
    basis: assumption
    note: "Synthea visit lengths are kept, clipped to this range"
  specialty_keywords:
    value:
      CARD: ["heart", "coronary", "ischemic", "myocardial"]
      ORTH: ["fracture", "osteoarthritis", "injury of", "concussion"]
    basis: assumption
    note: "A clinic encounter whose Synthea reason contains one of these goes to that clinic. Also used to pick a consultant"

  # ---- how much each kind of work touches the chart ----
  visit_rates:
    value:
      inpatient_nurse_per_shift: {day: 12, evening: 7, night: 4}
      inpatient_helper_per_shift: 3
      inpatient_attending_per_day: 3
      inpatient_covering_physician_per_shift: 0.5
      inpatient_clerk_per_day: 1
      ed_nurse: 6
      ed_physician: 4
      ed_clerk: 1
      clinic_physician: 3
      clinic_nurse: 3
      clinic_clerk: 1
      registration: 1
      coding: 2
      billing: 1
      hospital_wide_review: 1.5
    basis: derived
    source: "Sized against accesses per staff member per week (375-580)"
    note: "Mean chart visits per patient. No public source gives these. They are bounded by workload. Set before the first run so that no role needs more chart time than a shift holds, and unchanged since"
  helper_prob:
    value: 0.5
    basis: assumption
    note: "Chance per shift that a second nurse from the unit works an inpatient"
  documentation_prob:
    value: {inpatient_nurse: 0.6, ed_nurse: 0.6, clinic_nurse: 0.4}
    basis: derived
    source: "Sized against first accesses explained by direct evidence (about 23%, Fabbri & LeFevre 2013)"
    note: "Chance that a nurse's assignment is recorded in care_team. Physicians are always recorded. Set from a paper estimate before the first full run"
  inpatient_daily_orders:
    value: {medication: 2, lab: 2, imaging: 0.3}
    basis: assumption
    note: "Mean new orders per inpatient day, on top of the orders Synthea recorded for the encounter"
  order_caps:
    value: {medication: 2, imaging: 2}
    basis: assumption
    note: "At most this many Synthea items per encounter become orders"
  order_second_visit_prob:
    value: 0.25
    basis: assumption
    note: "Chance that the performing department opens the chart a second time for an order"
  registration_prob_clinic:
    value: 0.3
    basis: assumption
    note: "Share of clinic visits that registration staff also touch. Inpatient and emergency arrivals always are"
  coding_delay_days:
    value: [1, 5]
    basis: assumption
    note: "Days after discharge before a coder opens the chart"
  billing_delay_days:
    value: [3, 10]
    basis: assumption
    note: "Days after discharge before billing opens the chart"
  hospital_wide_review_prob:
    value: {inpatient_per_day: 0.6, emergency: 0.15}
    basis: assumption
    note: "Chance that care management (bed management, case management, infection control) opens a patient's chart, per inpatient day and per emergency visit"
  consult_prob:
    value: {inpatient: 0.25, emergency: 0.08}
    basis: assumption
    note: "Chance that an encounter gets an undocumented specialist consult"
  consult_visits:
    value: [2, 6]
    basis: assumption
    note: "Range of chart visits a consultant makes"
  consult_specialty_match_prob:
    value: 0.7
    basis: assumption
    note: "Chance the consultant comes from the clinic whose keywords match the encounter reason, when one matches"
  consult_departments:
    value: [CARD, ORTH, PCP]
    basis: assumption
    note: "Clinics whose physicians consult on inpatients and emergency patients"
  consult_duration_factor:
    value: 2.0
    basis: assumption
    note: "The spec says consult accesses run longer"
  float_prob:
    value: 0.04
    basis: assumption
    note: "Chance per shift that an inpatient nurse covers another unit or the emergency department"
  float_documented_prob:
    value: 0.5
    basis: assumption
    note: "Chance the schedule shows the covered unit"
  max_backlog_s:
    value: 7200
    basis: assumption
    note: "A user works one chart at a time and can fall this far behind. Past that, visits overlap as if on a second screen"
  # ---- people who know each other ----
  relationship_pull:
    value: {department co-worker: 3.22, last name: 1.53, proximity: 2.51, same street: 4.04}
    basis: published
    source: "Hedda et al. 2017, Table 2 (observed over expected, patients permuted)"
    note: "How much more likely a staff member is to be the one who works on a patient they share a surname, a street or a neighborhood with, and how much more likely staff are to be seen in their own department. Used as a weight, so the measured ratio can come out lower. Hedda et al. do not say how much of this excess is appropriate. Here all of it is ordinary work, and injected misuse comes on top"

  # ---- people ----
  households:
    value:
      multi_person_share: 0.55
      size_weights: {2: 0.50, 3: 0.25, 4: 0.17, 5: 0.08}
      same_surname_prob: 0.8
      relatives_apart_share: 0.15
      apart_same_surname_prob: 0.5
      emergency_contact_prob: 0.6
    basis: assumption
    note: "Synthea has no households or family links, so all of this is an overlay"
  vip_share:
    value: 0.005
    basis: assumption
    note: "Share of patients carrying the VIP flag"

  # ---- actions ----
  action_code_count:
    value: 400
    basis: assumption
    note: "Scaled down from 13,723 for a 30-day, 300-staff log"
  role_action_tilt:
    value:
      physician: {create: 1.2}
      nurse: {create: 1.5, update: 1.5}
      technician: {create: 1.2, update: 0.8}
      pharmacist: {update: 1.3}
      clerk: {query: 2.0, read: 1.2, create: 0.5, update: 0.6, print: 1.5}
      coder: {read: 1.3, create: 0.3, print: 1.5, copy: 2.0}
      coordinator: {read: 1.3, query: 1.5, create: 0.5, update: 0.6}
    basis: assumption
    note: "Multipliers on the category shares, by role"

  # ---- baselines (build step 4), not used by the generator ----
  responsibility_thresholds:
    value: {s: 1.0, t: 2.0, min_patients: 30}
    basis: published
    source: "Fabbri & LeFevre 2013 (s = 1, t = 2, diagnoses occurring at least 30 times)"
    note: "A department is responsible for a diagnosis when its z-scored access probability is at least s and its z-scored treatment probability at least t"
  review_budget_per_day:
    value: [10, 25, 50]
    basis: assumption
    note: "How many alerts a privacy office reviews in a day. Hedda et al. describe one or two people with part of their time. No public figure for a hospital this size"

  # ---- LLM triage (build step 5), not used by the generator ----
  triage:
    value: {context_lines: 30, context_hours: 12, encounters_shown: 5, temperature: 0, max_output_tokens: 16000, timeout_s: 600, workers: 16, cost_cap_usd: 5}
    basis: assumption
    note: "How many log lines of each kind and how many encounters a prompt shows, and the run settings. The user's other lines are the nearest ones within context_hours either side of the access. Temperature 0 so a rerun is as repeatable as the provider allows. max_output_tokens has to hold the model's reasoning as well as the summary. A trial of 80 calls on 13 Nov 2026 with a limit of 4,000 had 75 answers cut off before the summary began. Reasoning ran to about 3,800 tokens at the median and the five complete summaries took 500 to 850 more, so the limit is set well clear of both. timeout_s is how long one call may take. workers is how many calls run at once. cost_cap_usd stops a run or judge command once its own spend passes it"

  triage_provider:
    value:
      triage_extras:
        reasoning: {enabled: true}
        response_format: {type: json_object}
        provider: {only: [relace/fp4], allow_fallbacks: false}
      judge_extras:
        reasoning: {enabled: true}
        response_format: {type: json_object}
        provider: {only: [wafer/us], allow_fallbacks: false}
      usd_per_million_tokens: {input: 0.0399, cached_input: 0.03, output: 0.0784}
    basis: published
    source: "OpenRouter page for z-ai/glm-5.3-flash, Relace endpoint prices read 13 Nov 2026 (openrouter.ai/z-ai/glm-5.3-flash). OpenRouter documentation on reasoning tokens, provider routing and usage accounting"
    note: "Specific to OpenRouter. triage_extras is added to every request of systems 3 and 4 and judge_extras to every request of the faithfulness judge. The provider block pins one endpoint and forbids fallbacks, so every answer comes from the same serving of the model. The triage model is z-ai/glm-5.3-flash on Relace's fp4 endpoint and the judge is deepseek/deepseek-v4.1-flash-1017 on Wafer's US endpoint. The model IDs are set in .env. reasoning enabled with no effort named means OpenRouter's default level. OpenRouter reports what each call cost and that figure is what the run records. The prices here are only used when a reply carries no cost, and the same prices are assumed for the judge. Replace this entry when the model or the endpoint changes"

  case_set:
    value:
      per_stratum: 100
      larger: {order: 200, undocumented_team: 200, back_office: 200, direct: 200, hospital_wide: 150, H4b: 300}
      covers: 100
    basis: assumption
    note: "How many legitimate first accesses of each kind the LLM systems triage. Every misuse first access is included. The four kinds with about 15,000 first accesses each get 200, and H4b gets 300 because a relationship with no documented purpose is where a false alert is most likely. covers is how many covering accesses are sampled from the paired run. Results are weighted back to the full population"

  # ---- covering accesses (adversarial variant) ----
  covering:
    value: {enabled: false, accesses: 10, alpha: 0.75, hours_around: 1}
    basis: published
    source: "Xu et al. 2023 (heuristic attack: Jaccard similarity, alpha 0.75, and 10 covering accesses within a week)"
    note: "Off by default. `generate --covered` writes a second run that is identical except that each M1-M4 actor also makes this many covering accesses in each week with a target access. Their detectors work on a weekly graph, so when in the week a cover falls does not matter to them. Here the covers are placed within an hour either side of the week's first target access, an assumption, because the LLM is shown the log lines nearest the access and a cover it never sees cannot test it"

  # ---- injected misuse ----
  scenario_counts:
    value: {M1: 10, M2a: 10, M2b: 10, M3: 10, M4: 10, M5_events: 2, M6a: 5, M6b: 5}
    basis: assumption
    note: "No public source gives base rates for confirmed misuse. Detection is reported per scenario"
  m5_users_per_event:
    value: [8, 15]
    basis: assumption
    note: "Range of curious users per news event"
  target_in_actor_department_share:
    value: 0.2
    basis: assumption
    note: "Share of M1, M3 and M4 where the target has an encounter in the actor's own department"
  misuse_events_per_visit:
    value: [1, 3]
    basis: assumption
    note: "Range of events in one snooping visit"
  misuse_repeat_prob:
    value: 0.3
    basis: assumption
    note: "Chance that an M2a or M4 actor comes back on 2-4 different shifts"
  misuse_duration_cap_s:
    value: 120
    basis: assumption
    note: "The spec describes snooping views as short"
  shared_credential_visits:
    value: [4, 10]
    basis: assumption
    note: "Range of chart visits made under a borrowed account"
