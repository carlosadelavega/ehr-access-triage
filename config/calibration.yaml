# Calibration config for the synthetic EHR access-log generator.
#
# Everything the generator reads is in this file, so values measured from
# real data can replace published ones without code changes.
#
# targets     the published measures from the literature review. The report
#             compares generated data against them. `use` says how.
#               level     compare the generated value to the number
#               shape     compare ratios only (the UK log is far sparser)
#               reported  measured and shown, nothing is set to hit it
#               later     cannot be measured until the baselines exist
# parameters  what the generator uses. `basis` says where a value comes from.
#               published   taken from a cited source
#               derived     computed from published values, see note
#               assumption  no public source, a judgement call
#               setting     run setup, not a calibration choice

targets:
  accesses_per_staff_week:
    value: [375, 580]
    use: level
    source: "Fabbri & LeFevre 2013 (Michigan, about 375); Hedda et al. 2017 and Laszka et al. 2017 (Vanderbilt, about 580)"
  repeat_access_share:
    value: 0.92
    use: level
    source: "Hedda et al. 2017 (6.9M of 7.5M accesses in one week)"
    note: "A repeat is the same user opening the same patient earlier in the same week"
  self_access_share:
    value: 0.003
    use: level
    source: "Hedda et al. 2017 (21K of 7.5M accesses in one week)"
  first_access_explained_direct:
    value: 0.23
    use: level
    source: "Fabbri & LeFevre 2013"
  first_access_explained_with_department_link:
    value: 0.41
    use: reported
    source: "Fabbri & LeFevre 2013 (with diagnosis-department links)"
    note: "Measured here with a coarser stand-in, the department of the patient's encounter. The real templates arrive in build step 4"
  all_accesses_explained:
    value: 0.94
    use: reported
    source: "Fabbri & LeFevre 2011, 2013 (over 94% once repeats are filtered)"
  rule_match_share:
    value: [0.0003, 0.038]
    use: reported
    source: "Hedda et al. 2017 (0.03-3.8% by rule)"
  alerts_per_access:
    value: 0.10
    use: later
    source: "Laszka et al. 2017"
  duration_median_s:
    value: 45
    use: level
    source: "Herrera Montano et al."
  duration_p95_s:
    value: 775
    use: level
    source: "Herrera Montano et al."
  immediate_repeat_share:
    value: 0.554
    use: level
    source: "Herrera Montano et al."
    note: "Measured per user as the share of events on the same patient as that user's previous event"
  patients_per_user_day:
    value: {median: 5, p99: 80}
    use: shape
    source: "Herrera Montano et al."
  events_per_user:
    value: {median: 220, p95: 2160}
    use: shape
    source: "Herrera Montano et al. (over 18 months)"
  patients_per_user:
    value: {median: 149, p99: 3424}
    use: shape
    source: "Herrera Montano et al. (over 18 months)"
  action_top21_share:
    value: 0.80
    use: shape
    source: "Herrera Montano et al. (21 of 13,723 routine codes cover about 80% of events)"

parameters:
  # ---- run setup ----
  seed:
    value: 42
    basis: setting
  window_start:
    value: "2026-09-28"
    basis: setting
    note: "A Monday. The window ends before the Synthea reference date"
  window_days:
    value: 30
    basis: setting
  synthea:
    value: {version: "v3.2.0", seed: 42, population: 3500, reference_date: "20261101", location: "Massachusetts Springfield"}
    basis: setting
    note: "Must match scripts/run_synthea.sh"

  # ---- taken from published sources ----
  duration_median_s:
    value: 45
    basis: published
    source: "Herrera Montano et al."
  duration_p95_s:
    value: 775
    basis: published
    source: "Herrera Montano et al."
    note: "Durations are lognormal, fitted to the median and the 95th percentile"
  visit_continue_prob:
    value: 0.554
    basis: published
    source: "Herrera Montano et al. (55.4% of events immediately repeat the same patient)"
    note: "Chance that a visit to a chart continues with another event. Back-to-back visits to the same patient will push the measured share above this"
  self_access_share:
    value: 0.003
    basis: published
    source: "Hedda et al. 2017"
  action_top_n:
    value: 21
    basis: published
    source: "Herrera Montano et al."
  action_top_share:
    value: 0.80
    basis: published
    source: "Herrera Montano et al."
    note: "Code popularity is a power law whose exponent is solved so the top 21 codes carry this share"
  proximity_miles:
    value: 0.25
    basis: published
    source: "Hedda et al. 2017 (geographic proximity rule)"
  action_categories:
    value: {read: 0.50, query: 0.10, create: 0.16, update: 0.17, print: 0.04, copy: 0.02, delete: 0.01}
    basis: published
    source: "Category list from the CASRAI guide to audit-log requirements, which summarises ASTM E2147-18"
    note: "The category names are published. The shares are an assumption"

  # ---- hospital shape ----
  departments:
    value:
      MED1: {name: "Medical unit 1", kind: inpatient, hours: round_the_clock}
      MED2: {name: "Medical unit 2", kind: inpatient, hours: round_the_clock}
      SURG: {name: "Surgical unit", kind: inpatient, hours: round_the_clock}
      ICU: {name: "Intensive care unit", kind: inpatient, hours: round_the_clock}
      ED: {name: "Emergency department", kind: emergency, hours: round_the_clock}
      PCP: {name: "Primary care clinic", kind: clinic, hours: office}
      CARD: {name: "Cardiology clinic", kind: clinic, hours: office}
      ORTH: {name: "Orthopedics clinic", kind: clinic, hours: office}
      LAB: {name: "Laboratory", kind: ancillary, hours: round_the_clock}
      RAD: {name: "Radiology", kind: ancillary, hours: round_the_clock}
      PHARM: {name: "Pharmacy", kind: ancillary, hours: round_the_clock}
      REG: {name: "Registration", kind: back_office, hours: round_the_clock}
      HIM: {name: "Health information management", kind: back_office, hours: office}
      BILL: {name: "Billing", kind: back_office, hours: office}
    basis: assumption
    note: "A small community hospital. No public source for this layout"
  staffing:
    value:
      MED1: {physician: 6, nurse: 22, clerk: 2}
      MED2: {physician: 6, nurse: 22, clerk: 2}
      SURG: {physician: 3, nurse: 14, clerk: 1}
      ICU: {physician: 4, nurse: 20, clerk: 1}
      ED: {physician: 8, nurse: 26, clerk: 4}
      PCP: {physician: 10, nurse: 12, clerk: 4}
      CARD: {physician: 5, nurse: 6, clerk: 2}
      ORTH: {physician: 5, nurse: 6, clerk: 2}
      LAB: {technician: 22}
      RAD: {physician: 3, technician: 15}
      PHARM: {pharmacist: 14, technician: 4}
      REG: {clerk: 16}
      HIM: {coder: 16}
      BILL: {coder: 17}
    basis: assumption
    note: "300 staff in total, as agreed for milestone 1"
  staff_age_range:
    value: [22, 67]
    basis: assumption
    note: "Staff are sampled from Synthea adults in this age range"
  shifts:
    value: {day: [7, 15], evening: [15, 23], night: [23, 31], office: [8, 17]}
    basis: assumption
    note: "Start and end hour. Night runs into the next day"
  shift_weights:
    value: {day: 0.5, evening: 0.3, night: 0.2}
    basis: assumption
    note: "Share of round-the-clock staff on each shift"
  physician_shift_pattern:
    value:
      default: [day, day, evening, day, night, day]
      ED: [day, evening, night, day, evening, night, day, evening]
    basis: assumption
    note: "Physicians in a round-the-clock department take shifts in this order, so every unit has day cover and the emergency department is staffed evenly"
  shifts_per_week:
    value: 5
    basis: assumption
    note: "Round-the-clock staff take two random days off a week. Office staff work weekdays"
  devices_per_staff:
    value: 0.6
    basis: assumption
    note: "Workstations per department as a share of its staff. Physicians also get a mobile device"
  usual_device_weights:
    value: [0.7, 0.2, 0.1]
    basis: assumption
    note: "How often a user works on their first, second and third usual device"
  remote_share:
    value: 0.3
    basis: assumption
    note: "Share of back-office staff who mostly work from a remote device"

  # ---- encounters in the window ----
  encounter_lookback_years:
    value: 10
    basis: assumption
    note: "Synthea encounters this recent form the pool that is re-dated into the window. Five years leaves too few inpatient stays"
  inpatient_census:
    value: {MED1: 36, MED2: 36, SURG: 14, ICU: 12}
    basis: assumption
    note: "Average occupied beds. Set from the staffing above at about 5 patients per day-shift nurse, 2 in the ICU"
  inpatient_los_clip_hours:
    value: [12, 240]
    basis: assumption
    note: "Synthea stay lengths are kept, clipped to this range"
  ed_visits_per_day:
    value: 60
    basis: assumption
    note: "Emergency and urgent-care arrivals per day"
  ed_night_relative_rate:
    value: 0.4
    basis: assumption
    note: "Arrival rate from 23:00 to 07:00 relative to daytime"
  ed_los_clip_hours:
    value: [1, 12]
    basis: assumption
    note: "Synthea visit lengths are kept, clipped to this range"
  clinic_visits_per_physician_day:
    value: {PCP: 16, CARD: 9, ORTH: 9}
    basis: assumption
    note: "Appointments per physician on a weekday"
  clinic_los_clip_minutes:
    value: [15, 60]
    basis: assumption
    note: "Synthea visit lengths are kept, clipped to this range"
  specialty_keywords:
    value:
      CARD: ["heart", "coronary", "ischemic", "myocardial"]
      ORTH: ["fracture", "osteoarthritis", "injury of", "concussion"]
    basis: assumption
    note: "A clinic encounter whose Synthea reason contains one of these goes to that clinic. Also used to pick a consultant"

  # ---- how much each kind of work touches the chart ----
  visit_rates:
    value:
      inpatient_nurse_per_shift: {day: 12, evening: 7, night: 4}
      inpatient_helper_per_shift: 3
      inpatient_attending_per_day: 3
      inpatient_covering_physician_per_shift: 0.5
      inpatient_clerk_per_day: 1
      ed_nurse: 6
      ed_physician: 4
      ed_clerk: 1
      clinic_physician: 3
      clinic_nurse: 3
      clinic_clerk: 1
      registration: 1
      coding: 2
      billing: 1
    basis: derived
    source: "Sized against accesses per staff member per week (375-580)"
    note: "Mean chart visits per patient. No public source gives these. They are bounded by workload. A visit averages 2.2 events and about 7 minutes of chart time, so a shift cannot hold many more visits than these. Within that bound they aim at the low end of the published volume range"
  helper_prob:
    value: 0.5
    basis: assumption
    note: "Chance per shift that a second nurse from the unit works an inpatient"
  documentation_prob:
    value: {inpatient_nurse: 0.6, ed_nurse: 0.6, clinic_nurse: 0.4}
    basis: derived
    source: "Sized against first accesses explained by direct evidence (about 23%, Fabbri & LeFevre 2013)"
    note: "Chance that a nurse's assignment is recorded in care_team. Physicians are always recorded. Set from a paper estimate before the first full run"
  inpatient_daily_orders:
    value: {medication: 2, lab: 2, imaging: 0.3}
    basis: assumption
    note: "Mean new orders per inpatient day, on top of the orders Synthea recorded for the encounter"
  order_caps:
    value: {medication: 2, imaging: 2}
    basis: assumption
    note: "At most this many Synthea items per encounter become orders"
  order_second_visit_prob:
    value: 0.25
    basis: assumption
    note: "Chance that the performing department opens the chart a second time for an order"
  registration_prob_clinic:
    value: 0.3
    basis: assumption
    note: "Share of clinic visits that registration staff also touch. Inpatient and emergency arrivals always are"
  coding_delay_days:
    value: [1, 5]
    basis: assumption
    note: "Days after discharge before a coder opens the chart"
  billing_delay_days:
    value: [3, 10]
    basis: assumption
    note: "Days after discharge before billing opens the chart"
  consult_prob:
    value: {inpatient: 0.25, emergency: 0.08}
    basis: assumption
    note: "Chance that an encounter gets an undocumented specialist consult"
  consult_visits:
    value: [2, 6]
    basis: assumption
    note: "Range of chart visits a consultant makes"
  consult_specialty_match_prob:
    value: 0.7
    basis: assumption
    note: "Chance the consultant comes from the clinic whose keywords match the encounter reason, when one matches"
  consult_departments:
    value: [CARD, ORTH, PCP]
    basis: assumption
    note: "Clinics whose physicians consult on inpatients and emergency patients"
  consult_duration_factor:
    value: 2.0
    basis: assumption
    note: "The spec says consult accesses run longer"
  float_prob:
    value: 0.04
    basis: assumption
    note: "Chance per shift that an inpatient nurse covers another unit or the emergency department"
  float_documented_prob:
    value: 0.5
    basis: assumption
    note: "Chance the schedule shows the covered unit"
  max_backlog_s:
    value: 7200
    basis: assumption
    note: "A user works one chart at a time and can fall this far behind. Past that, visits overlap as if on a second screen"
  duration_cap_s:
    value: 3600
    basis: assumption
    note: "Longest single action. Affects under 1% of draws"

  # ---- people ----
  households:
    value:
      multi_person_share: 0.55
      size_weights: {2: 0.50, 3: 0.25, 4: 0.17, 5: 0.08}
      same_surname_prob: 0.8
      relatives_apart_share: 0.15
      apart_same_surname_prob: 0.5
      emergency_contact_prob: 0.6
    basis: assumption
    note: "Synthea has no households or family links, so all of this is an overlay"
  vip_share:
    value: 0.005
    basis: assumption
    note: "Share of patients carrying the VIP flag"

  # ---- actions ----
  action_code_count:
    value: 400
    basis: assumption
    note: "Scaled down from 13,723 for a 30-day, 300-staff log"
  role_action_tilt:
    value:
      physician: {create: 1.2}
      nurse: {create: 1.5, update: 1.5}
      technician: {create: 1.2, update: 0.8}
      pharmacist: {update: 1.3}
      clerk: {query: 2.0, read: 1.2, create: 0.5, update: 0.6, print: 1.5}
      coder: {read: 1.3, create: 0.3, print: 1.5, copy: 2.0}
    basis: assumption
    note: "Multipliers on the category shares, by role"

  # ---- injected misuse ----
  scenario_counts:
    value: {M1: 10, M2a: 10, M2b: 10, M3: 10, M4: 10, M5_events: 2, M6a: 5, M6b: 5}
    basis: assumption
    note: "No public source gives base rates for confirmed misuse. Detection is reported per scenario"
  m5_users_per_event:
    value: [8, 15]
    basis: assumption
    note: "Range of curious users per news event"
  target_in_actor_department_share:
    value: 0.2
    basis: assumption
    note: "Share of M1, M3 and M4 where the target has an encounter in the actor's own department"
  misuse_events_per_visit:
    value: [1, 3]
    basis: assumption
    note: "Range of events in one snooping visit"
  misuse_repeat_prob:
    value: 0.3
    basis: assumption
    note: "Chance that an M2a or M4 actor comes back on 2-4 different shifts"
  misuse_duration_cap_s:
    value: 300
    basis: assumption
    note: "The spec describes snooping views as short"
  shared_credential_visits:
    value: [4, 10]
    basis: assumption
    note: "Range of chart visits made under a borrowed account"
