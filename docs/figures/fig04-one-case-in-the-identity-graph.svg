  <g id="text_20">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(7.2 355.474828)">Each drawing is every edge on the evidence paths the LLM + Graph was shown for that case, at the encounter nearest the access. The organization co-worker connection is the patient</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(7.2 363.873187)">being employed in a department, so it adds no edge of its own here. The LLM saw the same log lines and no graph. Both cases carry the same co-worker tie. Only the legitimate one</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(7.2 372.271547)">also has a care-team path to the patient's stay.</text>
  </g>
