   <g id="text_27">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="72" y="15.558281" transform="rotate(-0 72 15.558281)">Inside a review budget</text>
   </g>
  </g>
  <g id="text_28">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(7.2 309.465109)">The reviewer takes the highest-ranked alerts each day. Rules are ranked by their observed-to-expected ratios, the LLM systems by</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(7.2 317.863469)">disposition and then the priority the model gave. Every system is scored on an average day, as in the budget table in</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(7.2 326.261828)">docs/llm-results.md, and counts are rounded down. The budgets of 10, 25 and 50 are an assumption.</text>
  </g>
