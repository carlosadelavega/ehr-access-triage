  <g id="text_17">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(101.332656 252.441109)">Dark is escalate, which goes to the Privacy Officer. Light is verify, which asks the user's supervisor. The rules raise alerts only, so all of theirs go to the officer.</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(101.332656 260.839469)">Precision is at escalate. LLM figures are pass 1, weighted back from the case set. The variant states employment as a fact and adds that the graph holds no</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(101.332656 269.237828)">connection where that was the only one (spec 11.9 and 11.10). Same numbers as the variant section of docs/llm-results.md.</text>
  </g>
