  <g id="text_21">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(42.679531 264.537109)">First check, in code, over every claim: each fact a claim cites was shown to the model. The light part passes only because a range such as L2-L31 counts as every fact in it. Judge, over the</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(42.679531 272.935469)">claims it gave a verdict on: supported means the cited facts confirm all of it, partly that it adds an interpretation. A hand-read found about half of a sample of unsupported verdicts to hold, so</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(42.679531 281.333828)">that share is an upper bound (docs/judge-review.md). Counts are over the sample, as in docs/llm-results.md.</text>
  </g>
